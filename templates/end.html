{% load static %}
<style>
    .end {
        position: absolute;
        background-color: #2c2c2c; /* Sötétszürke háttér */
        display: flex;
        justify-content: center; /* Középre igazítás */
        align-items: center;
        height: 30%;
        width: 100%;
        left: 0;
        z-index: 900;
        padding: 0 3%;
        box-sizing: border-box;
    }

    .hs_end {
        display: flex;
        justify-content: center; /* Középre igazítás */
        align-items: center;
        width: 100%;
    }

    .h_div {
        text-align: center;
        flex-basis: 30%;
        max-width: 30%;
        box-sizing: border-box;
    }

    .h2_end, .h3_end {
        color: white; /* Fehér szöveg */
        font-family: helvetica;
        text-align: center;
        font-size: 20px;
    }

    .h3_end {
        color: white; /* Fehér szöveg */
    }

    #hr_end {
        display: none;
    }

    @media(max-width:1200px) {
        .end {
            margin-top: 5%;
            height: 20%;
        }
    }

    @media(max-width:880px) {
        .end {
            flex-direction: column;
            height: 430px;
            padding: 5% 0;
        }

        .hs_end {
            flex-direction: column;
            width: 100%;
        }

        .h_div {
            width: 100%;
            max-width: 100%;
            margin-bottom: 10px;
        }

        .h2_end, .h3_end {
            font-size: 15px;
            font-weight: bold;
        }

        #hr_end {
            display: block;
            width: 50%;
        }
    }
</style>

<div class="end">
    <div class="hs_end">
        <hr id="hr_end">
        <div class="h_div">
            <h2 class="h2_end">PSL-Scale</h2>
            <h3 class="h3_end"></h3>
            <div style="display: flex; gap :10px; justify-content: center;">
                <a method="GET" href="{% url 'gyakorikerdesek'%}" style="text-decoration: none; cursor: pointer;">
                <h2 class="h3_end">Privacy Policy</h2>
            </a>
            <a method="GET" href="{% url 'contact'%}" style="text-decoration: none; cursor: pointer;">
                <h2 class="h3_end">Contact</h2>
            </a>
            <a method="GET" href="{% url 'term'%}" style="text-decoration: none; cursor: pointer;">
                <h2 class="h3_end">Terms of Use</h2>
            </a>
            </div>
            
        </div>
    </div>
</div>
